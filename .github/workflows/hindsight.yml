name: "Git Risk Analysis"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  risk-analysis:
    name: Git Risk Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Git Risk Analysis
        id: risk
        run: |
          # Configuration
          SINCE_DAYS=90
          RISK_THRESHOLD=7
          
          # Get commits from last 90 days
          SINCE_DATE=$(python3 -c "from datetime import datetime, timedelta; print((datetime.now() - timedelta(days=$SINCE_DAYS)).strftime('%Y-%m-%d'))")
          echo "SINCE_DATE=$SINCE_DATE"
          
          echo "## 📊 Git Risk Analysis (last $SINCE_DAYS days)" > risk-summary.md
          echo "" >> risk-summary.md
          echo "| File | Commits | Authors | Lines Changed | Risk Score |" >> risk-summary.md
          echo "|------|---------|---------|---------------|------------|" >> risk-summary.md
          
          # Test basic git log
          echo "Testing git log..."
          git log --since="$SINCE_DATE" --pretty=format: --name-only | head -20
          
          # Analyze each file
          git log --since="$SINCE_DATE" --pretty=format: --name-only | \
            grep -vE '^\s*$' | \
            grep -vE '\.(md|txt|yml|yaml|toml|json|lock)$' | \
            grep -vE '(^docs/|^tests/|^test_|\.test\.|\.spec\.)' | \
            sort | uniq -c | sort -rn | head -5 | while read count file; do
            
            echo "Processing: $file (count=$count)"
            
            # Get unique authors
            authors=$(git log --since="$SINCE_DATE" --pretty=format:"%an" -- "$file" | sort -u | wc -l)
            echo "  Authors: $authors"
            
            # Get churn
            stats=$(git log --since="$SINCE_DATE" --pretty=format: --numstat -- "$file" | awk '{added+=$1; removed+=$2} END {print added+removed}')
            echo "  Stats: ${stats:-0}"
            
            # Risk score via Python
            risk_score=$(python3 -c "
commits = $count
author_count = $authors
churn = ${stats:-0}
commit_factor = min(commits / 20.0, 1.0) * 4
author_factor = (1.0 - min(author_count / 3.0, 1.0)) * 3
churn_factor = min(churn / 500.0, 1.0) * 3
risk = commit_factor + author_factor + churn_factor
print(f'{risk:.1f}')
            ")
            echo "  Risk: $risk_score"
            
            printf "| %s | %d | %d | %s | %.1f |\n" "$file" "$count" "$authors" "${stats:-0}" "$risk_score" >> risk-summary.md
          done
          
          echo "" >> risk-summary.md
          echo "**Risk Score Formula:** Commit Frequency (40%) + Author Concentration (30%) + Code Churn (30%)" >> risk-summary.md
          echo "*Scores > 7 indicate files needing extra review attention.*" >> risk-summary.md
          
          # Generate JSON
          python3 << 'PYEOF' > risk-report.json
import subprocess
import json
import sys
from datetime import datetime, timedelta

since_days = 90
since_date = (datetime.now() - timedelta(days=since_days)).strftime('%Y-%m-%d')

result = subprocess.run([
    'git', 'log', f'--since={since_date}', '--pretty=format:', '--name-only'
], capture_output=True, text=True)

files = {}
for line in result.stdout.strip().split('\n'):
    line = line.strip()
    if not line:
        continue
    if line.endswith(('.md', '.txt', '.yml', '.yaml', '.toml', '.json', '.lock')):
        continue
    if any(line.startswith(p) for p in ['docs/', 'tests/', 'test_']):
        continue
    if '.test.' in line or '.spec.' in line:
        continue
    files[line] = files.get(line, 0) + 1

report = {"files": [], "summary": {}}
for file, count in sorted(files.items(), key=lambda x: -x[1])[:30]:
    authors_result = subprocess.run([
        'git', 'log', f'--since={since_date}', '--pretty=format:%an', '--', file
    ], capture_output=True, text=True)
    author_count = len(set(authors_result.stdout.strip().split('\n'))) if authors_result.stdout.strip() else 0
    
    stats_result = subprocess.run([
        'git', 'log', f'--since={since_date}', '--pretty=format:', '--numstat', '--', file
    ], capture_output=True, text=True)
    churn = 0
    for stat_line in stats_result.stdout.strip().split('\n'):
        if stat_line.strip():
            parts = stat_line.split('\t')
            if len(parts) >= 2:
                try:
                    churn += int(parts[0]) + int(parts[1])
                except:
                    pass
    
    commit_factor = min(count / 20.0, 1.0) * 4
    author_factor = (1.0 - min(author_count / 3.0, 1.0)) * 3
    churn_factor = min(churn / 500.0, 1.0) * 3
    risk = round(commit_factor + author_factor + churn_factor, 1)
    
    report["files"].append({
        "path": file,
        "commits": count,
        "authors": author_count,
        "churn": churn,
        "risk_score": risk
    })

report["summary"] = {
    "since_days": since_days,
    "total_files_analyzed": len(files),
    "high_risk_count": len([f for f in report["files"] if f["risk_score"] > 7]),
    "threshold": 7
}

json.dump(report, sys.stdout, indent=2)
PYEOF
          
          # Check for high-risk files
          HIGH_RISK=$(python3 -c "
import json
with open('risk-report.json') as f:
    data = json.load(f)
high = [f for f in data['files'] if f['risk_score'] > 7]
print(len(high))
          ")
          
          if [ "$HIGH_RISK" -gt 0 ]; then
            echo "::warning::Found $HIGH_RISK high-risk files (score > 7)"
            python3 -c "
import json
with open('risk-report.json') as f:
    data = json.load(f)
for f in data['files']:
    if f['risk_score'] > 7:
        print(f\"  {f['path']}: risk={f['risk_score']:.1f} (commits={f['commits']}, authors={f['authors']}, churn={f['churn']})\")
            "
          else
            echo "✅ No high-risk files detected (threshold: $RISK_THRESHOLD)"
          fi
          
          echo "Risk summary generated:"
          cat risk-summary.md

      - name: Upload Risk Report
        uses: actions/upload-artifact@v4
        with:
          name: git-risk-report
          path: |
            risk-summary.md
            risk-report.json
          retention-days: 30

      - name: Post Risk Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('risk-summary.md', 'utf8');
            
            if (summary.trim()) {
              const body = `## 📊 Git Risk Analysis\n\n${summary}\n\n---\n*Analysis based on last 90 days of git history*`;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }